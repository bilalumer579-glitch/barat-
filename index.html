<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mayoon Invitation</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<!-- Falling Flowers -->
<div id="flowers"></div>

<!-- Music -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Music Button -->
<button id="musicBtn" type="button">
    🔊
</button>

<!-- Envelope -->
<div id="envelopePage">

    <div class="tapText">
        Tap To Open
    </div>

    <div class="envelope" id="envelope">

        <div class="bow">
            <div class="leftBow"></div>
            <div class="rightBow"></div>
            <div class="centerBow"></div>
        </div>

        <div class="flap"></div>

        <div class="letter">

            <h2>You're Invited</h2>

            <p>Khadija ❤️ Shayan</p>

        </div>

    </div>

</div>

<!-- Countdown -->
<div id="countdownPage">

    <div id="countdownNumber">
        3
    </div>

</div>

<!-- Invitation Card -->
<div id="cardPage">

    <img
        src="invitation.jpg"
        id="cardImage"
        alt="Invitation Card"
    >

    <!-- More Invitation Link -->
    <a
        href="https://bilalumer579-glitch.github.io/massages-web/"
        class="moreInvitationButton"
        target="_blank"
    >
        Click To Make More Invitation 💌
    </a>

</div>

<script src="script.js"></script>

</body>
</html>
